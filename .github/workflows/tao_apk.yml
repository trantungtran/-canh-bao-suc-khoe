name: Tao APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tao du an Flutter
        run: |
          flutter create --org vn.canhbao --platforms android --project-name canh_bao_suc_khoe app
          cp pubspec.yaml app/
          cp -r lib/* app/lib/
          mkdir -p app/assets && cp assets/* app/assets/
          cp android_ghi_de/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          rm -f app/test/widget_test.dart
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../CanhBaoSucKhoe.apk
      - name: Dang file APK len muc Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Canh bao suc khoe - ban ${{ github.run_number }}
          files: CanhBaoSucKhoe.apk
